<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>開発の図の見本</title><style>body{font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;background:#f6f7f9;color:#1d2430;margin:0;padding:16px}h1{font-size:1.3rem}h2{font-size:1.05rem;margin:22px 0 8px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}figure{margin:0;background:#fff;border:1px solid #d5dae2;border-radius:8px;padding:8px}svg{width:100%;height:auto;display:block}figcaption{font-size:.8rem;line-height:1.5}figcaption b{display:block;font-size:.85rem}figcaption span{display:block;color:#5d6778}figcaption code{font-size:.75rem}</style></head><body>
<!-- 開発の図の形の見本。各図の svg は形を示す最小の描き方で、値と名前は架空。Mermaid の行は、その形を描ける Mermaid の図の種類。 -->
<h1>開発の図の見本（38種）</h1>
<h2>構造</h2><div class="g">
<figure><svg viewBox="0 0 120 80" role="img" aria-label="System Context"><rect x="42" y="30" width="36" height="20" fill="#dcf3e3" stroke="#15803d" rx="2"/><text x="60.0" y="42.0" font-size="6" text-anchor="middle" fill="#5d6778">本体</text><circle cx="16" cy="14" r="7" fill="#d5dae2" stroke="#9aa4b5" /><rect x="4" y="58" width="28" height="14" fill="#dbe8fd" stroke="#2563eb" rx="2"/><text x="18.0" y="67.0" font-size="6" text-anchor="middle" fill="#5d6778">外部</text><rect x="88" y="6" width="28" height="14" fill="#dbe8fd" stroke="#2563eb" rx="2"/><text x="102.0" y="15.0" font-size="6" text-anchor="middle" fill="#5d6778">外部</text><rect x="88" y="58" width="28" height="14" fill="#dbe8fd" stroke="#2563eb" rx="2"/><text x="102.0" y="67.0" font-size="6" text-anchor="middle" fill="#5d6778">外部</text><line x1="22" y1="19" x2="44" y2="32" stroke="#2563eb" stroke-width="1.2" /><polygon points="44,32 40,32 42,29" fill="#2563eb" stroke="#2563eb"/><line x1="78" y1="34" x2="90" y2="20" stroke="#2563eb" stroke-width="1.2" /><polygon points="90,20 89,24 86,22" fill="#2563eb" stroke="#2563eb"/><line x1="78" y1="46" x2="90" y2="60" stroke="#2563eb" stroke-width="1.2" /><polygon points="90,60 86,58 89,56" fill="#2563eb" stroke="#2563eb"/><line x1="42" y1="46" x2="32" y2="60" stroke="#2563eb" stroke-width="1.2" /><polygon points="32,60 33,56 36,58" fill="#2563eb" stroke="#2563eb"/></svg><figcaption><b>System Context</b>形：中央に作るシステム、周りに利用者と外部のシステムを置き、何をやりとりするかを書いた矢印で結ぶ<span>使う場面：設計書の最初、範囲の合意、開発者でない人への説明</span><span>Mermaid：<code>C4Context</code></span></figcaption></figure>
<figure><svg viewBox="0 0 120 80" role="img" aria-label="Container diagram"><rect x="2" y="2" width="116" height="76" fill="none" stroke="#9aa4b5" stroke-dasharray="3 2"/><rect x="8" y="10" width="28" height="14" fill="#dbe8fd" stroke="#2563eb" rx="2"/><text x="22.0" y="19.0" font-size="6" text-anchor="middle" fill="#5d6778">Web</text><rect x="46" y="10" width="28" height="14" fill="#dcf3e3" stroke="#15803d" rx="2"/><text x="60.0" y="19.0" font-size="6" text-anchor="middle" fill="#5d6778">API</text><rect x="84" y="10" width="28" height="14" fill="#dbe8fd" stroke="#2563eb" rx="2"/><text x="98.0" y="19.0" font-size="6" text-anchor="middle" fill="#5d6778">Worker</text><rect x="46" y="52" width="28" height="14" fill="#dbe8fd" stroke="#2563eb" rx="2"/><text x="60.0" y="61.0" font-size="6" text-anchor="middle" fill="#5d6778">DB</text><rect x="84" y="52" width="28" height="14" fill="#dbe8fd" stroke="#2563eb" rx="2"/><text x="98.0" y="61.0" font-size="6" text-anchor="middle" fill="#5d6778">Queue</text><line x1="36" y1="17" x2="46" y2="17" stroke="#2563eb" stroke-width="1.2" /><polygon points="46,17 42,19 42,15" fill="#2563eb" stroke="#2563eb"/><line x1="60" y1="24" x2="60" y2="52" stroke="#2563eb" stroke-width="1.2" /><polygon points="60,52 58,48 62,48" fill="#2563eb" stroke="#2563eb"/><line x1="74" y1="22" x2="90" y2="52" stroke="#2563eb" stroke-width="1.2" /><polygon points="90,52 87,50 90,48" fill="#2563eb" stroke="#2563eb"/><line x1="98" y1="52" x2="98" y2="24" stroke="#2563eb" stroke-width="1.2" /><polygon points="98,24 100,28 96,28" fill="#2563eb" stroke="#2563eb"/></svg><figcaption><b>Container diagram</b>形：実行する単位（Web、API、DB、キュー）を四角にし、通信の向きと方式（HTTPS、SQL）を矢印に書く<span>使う場面：全体の構成、変更が及ぶ範囲</span><span>Mermaid：<code>C4Container</code></span></figcaption></figure>
<figure><svg viewBox="0 0 120 80" role="img" aria-label="Component diagram"><rect x="4" y="4" width="112" height="72" fill="none" stroke="#2563eb" stroke-dasharray="3 2"/><rect x="10" y="12" width="30" height="14" fill="#dbe8fd" stroke="#2563eb" rx="2"/><text x="25.0" y="21.0" font-size="6" text-anchor="middle" fill="#5d6778">Handler</text><rect x="46" y="12" width="30" height="14" fill="#dcf3e3" stroke="#15803d" rx="2"/><text x="61.0" y="21.0" font-size="6" text-anchor="middle" fill="#5d6778">Service</text><rect x="82" y="12" width="30" height="14" fill="#dbe8fd" stroke="#2563eb" rx="2"/><text x="97.0" y="21.0" font-size="6" text-anchor="middle" fill="#5d6778">Client</text><rect x="46" y="50" width="30" height="14" fill="#dbe8fd" stroke="#2563eb" rx="2"/><text x="61.0" y="59.0" font-size="6" text-anchor="middle" fill="#5d6778">Repo</text><line x1="40" y1="19" x2="46" y2="19" stroke="#2563eb" stroke-width="1.2" /><polygon points="46,19 42,21 42,17" fill="#2563eb" stroke="#2563eb"/><line x1="76" y1="19" x2="82" y2="19" stroke="#2563eb" stroke-width="1.2" /><polygon points="82,19 78,21 78,17" fill="#2563eb" stroke="#2563eb"/><line x1="61" y1="26" x2="61" y2="50" stroke="#2563eb" stroke-width="1.2" /><polygon points="61,50 59,46 63,46" fill="#2563eb" stroke="#2563eb"/></svg><figcaption><b>Component diagram</b>形：1つの実行単位の中を部品に分け、どの部品がどれを使うかを矢印で示す<span>使う場面：モジュールの分け方、どこに何を置くか</span><span>Mermaid：<code>C4Component</code></span></figcaption></figure>
<figure><svg viewBox="0 0 120 80" role="img" aria-label="Layer diagram"><rect x="10" y="6" width="100" height="14" fill="#dbe8fd" stroke="#2563eb" rx="2"/><text x="60.0" y="15.0" font-size="6" text-anchor="middle" fill="#5d6778">UI</text><rect x="10" y="24" width="100" height="14" fill="#dcf3e3" stroke="#15803d" rx="2"/><text x="60.0" y="33.0" font-size="6" text-anchor="middle" fill="#5d6778">Application</text><rect x="10" y="42" width="100" height="14" fill="#dbe8fd" stroke="#2563eb" rx="2"/><text x="60.0" y="51.0" font-size="6" text-anchor="middle" fill="#5d6778">Domain</text><rect x="10" y="60" width="100" height="14" fill="#d5dae2" stroke="#9aa4b5" rx="2"/><text x="60.0" y="69.0" font-size="6" text-anchor="middle" fill="#5d6778">Infrastructure</text><line x1="114" y1="10" x2="114" y2="70" stroke="#c2410c" stroke-width="1.2" /><polygon points="114,70 112,66 116,66" fill="#c2410c" stroke="#c2410c"/></svg><figcaption><b>Layer diagram</b>形：横の帯を積み、矢印は上から下の向きだけにする<span>使う場面：層の分け方と、依存してよい向き</span><span>Mermaid：<code>block-beta</code></span></figcaption></figure>
<figure><svg viewBox="0 0 120 80" role="img" aria-label="Dependency graph"><circle cx="16" cy="40" r="7" fill="#dbe8fd" stroke="#2563eb" /><circle cx="46" cy="16" r="7" fill="#dbe8fd" stroke="#2563eb" /><circle cx="46" cy="64" r="7" fill="#dbe8fd" stroke="#2563eb" /><circle cx="80" cy="40" r="7" fill="#dbe8fd" stroke="#2563eb" /><circle cx="106" cy="16" r="7" fill="#dbe8fd" stroke="#2563eb" /><line x1="23" y1="36" x2="40" y2="20" stroke="#2563eb" stroke-width="1.2" /><polygon points="40,20 39,24 36,21" fill="#2563eb" stroke="#2563eb"/><line x1="23" y1="44" x2="40" y2="60" stroke="#2563eb" stroke-width="1.2" /><polygon points="40,60 36,59 39,56" fill="#2563eb" stroke="#2563eb"/><line x1="53" y1="20" x2="73" y2="36" stroke="#2563eb" stroke-width="1.2" /><polygon points="73,36 69,35 71,32" fill="#2563eb" stroke="#2563eb"/><line x1="73" y1="44" x2="53" y2="60" stroke="#c2410c" stroke-width="1.2" /><polygon points="53,60 55,56 57,59" fill="#c2410c" stroke="#c2410c"/><line x1="46" y1="57" x2="46" y2="23" stroke="#c2410c" stroke-width="1.2" /><polygon points="46,23 48,27 44,27" fill="#c2410c" stroke="#c2410c"/><line x1="87" y1="36" x2="100" y2="20" stroke="#2563eb" stroke-width="1.2" /><polygon points="100,20 99,24 96,22" fill="#2563eb" stroke="#2563eb"/></svg><figcaption><b>Dependency graph</b>形：モジュールを点、依存を矢印にし、循環している矢印だけ色を変える<span>使う場面：循環した依存、直す範囲</span><span>Mermaid：<code>flowchart</code></span></figcaption></figure>
<figure><svg viewBox="0 0 120 80" role="img" aria-label="Class diagram"><rect x="8" y="8" width="32" height="30" fill="#fff" stroke="#2563eb" /><line x1="8" y1="16" x2="40" y2="16" stroke="#2563eb" stroke-width="1" /><line x1="8" y1="28" x2="40" y2="28" stroke="#2563eb" stroke-width="1" /><text x="24" y="14" font-size="6" text-anchor="middle" fill="#5d6778">Order</text><rect x="80" y="8" width="32" height="30" fill="#fff" stroke="#2563eb" /><line x1="80" y1="16" x2="112" y2="16" stroke="#2563eb" stroke-width="1" /><line x1="80" y1="28" x2="112" y2="28" stroke="#2563eb" stroke-width="1" /><text x="96" y="14" font-size="6" text-anchor="middle" fill="#5d6778">Item</text><line x1="40" y1="22" x2="80" y2="22" stroke="#2563eb" stroke-width="1.5" /><text x="46" y="20" font-size="6" text-anchor="middle" fill="#5d6778">1</text><text x="74" y="20" font-size="6" text-anchor="middle" fill="#5d6778">*</text><rect x="8" y="52" width="32" height="20" fill="#fff" stroke="#2563eb" /><text x="24" y="64" font-size="6" text-anchor="middle" fill="#5d6778">Paid</text><line x1="24" y1="52" x2="24" y2="42" stroke="#2563eb" stroke-width="1.5" /><polygon points="24,38 20,44 28,44" fill="#fff" stroke="#2563eb"/></svg><figcaption><b>Class diagram</b>形：型を3つに区切った四角（名前、属性、操作）にし、継承は白い三角の矢印、関連は線と数で結ぶ<span>使う場面：ドメインのモデル、型の設計</span><span>Mermaid：<code>classDiagram</code></span></figcaption></figure>
<figure><svg viewBox="0 0 120 80" role="img" aria-label="Context Map"><circle cx="26" cy="26" r="18" fill="#dcf3e3" stroke="#15803d" /><circle cx="92" cy="26" r="18" fill="#dbe8fd" stroke="#2563eb" /><circle cx="60" cy="62" r="14" fill="#dbe8fd" stroke="#2563eb" /><line x1="44" y1="26" x2="74" y2="26" stroke="#2563eb" stroke-width="1.5" /><text x="59" y="22" font-size="6" text-anchor="middle" fill="#5d6778">U → D</text><rect x="70" y="20" width="6" height="12" fill="#fde5d6" stroke="#c2410c" /><line x1="36" y1="40" x2="50" y2="54" stroke="#2563eb" stroke-width="1.5" /><text x="60" y="64" font-size="6" text-anchor="middle" fill="#5d6778"></text></svg><figcaption><b>Context Map</b>形：業務の境界（Bounded Context）を円にし、上流と下流、変換の層（ACL）などの関係を線に書く<span>使う場面：チームとサービスの境界、つなぎ方の方針</span></figcaption></figure>
<figure><svg viewBox="0 0 120 80" role="img" aria-label="Wardley map"><line x1="10" y1="72" x2="112" y2="72" stroke="#9aa4b5" stroke-width="1.5" /><line x1="10" y1="4" x2="10" y2="72" stroke="#9aa4b5" stroke-width="1.5" /><line x1="36" y1="8" x2="36" y2="72" stroke="#d5dae2" stroke-width="1" stroke-dasharray="3 2"/><line x1="62" y1="8" x2="62" y2="72" stroke="#d5dae2" stroke-width="1" stroke-dasharray="3 2"/><line x1="88" y1="8" x2="88" y2="72" stroke="#d5dae2" stroke-width="1" stroke-dasharray="3 2"/><circle cx="70" cy="10" r="4" fill="#c2410c" stroke="#c2410c" /><circle cx="40" cy="30" r="4" fill="#dbe8fd" stroke="#2563eb" /><circle cx="80" cy="36" r="4" fill="#dbe8fd" stroke="#2563eb" /><circle cx="96" cy="60" r="4" fill="#d5dae2" stroke="#9aa4b5" /><circle cx="24" cy="50" r="4" fill="#dcf3e3" stroke="#15803d" /><line x1="70" y1="10" x2="40" y2="30" stroke="#2563eb" stroke-width="1" /><line x1="70" y1="10" x2="80" y2="36" stroke="#2563eb" stroke-width="1" /><line x1="40" y1="30" x2="24" y2="50" stroke="#2563eb" stroke-width="1" /><line x1="80" y1="36" x2="96" y2="60" stroke="#2563eb" stroke-width="1" /><line x1="24" y1="50" x2="40" y2="50" stroke="#15803d" stroke-width="1" stroke-dasharray="3 2"/><polygon points="40,50 36,52 36,48" fill="#15803d" stroke="#15803d"/></svg><figcaption><b>Wardley map</b>形：縦に利用者への近さ、横に成熟度（作りかけから汎用品）を取り、部品を点で置いて依存を線で結ぶ<span>使う場面：作るか買うか、どこに投資するか</span></figcaption></figure>
<figure><svg viewBox="0 0 120 80" role="img" aria-label="部品と関心事の表"><rect x="30" y="8" width="22" height="16" fill="#f8f9fb" stroke="#9aa4b5" /><circle cx="41" cy="16" r="3" fill="#c2410c" stroke="#c2410c" /><rect x="30" y="24" width="22" height="16" fill="#f8f9fb" stroke="#9aa4b5" /><circle cx="41" cy="32" r="3" fill="#15803d" stroke="#15803d" /><rect x="30" y="40" width="22" height="16" fill="#f8f9fb" stroke="#9aa4b5" /><circle cx="41" cy="48" r="3" fill="#15803d" stroke="#15803d" /><rect x="30" y="56" width="22" height="16" fill="#f8f9fb" stroke="#9aa4b5" /><circle cx="41" cy="64" r="3" fill="#15803d" stroke="#15803d" /><rect x="52" y="8" width="22" height="16" fill="#f8f9fb" stroke="#9aa4b5" /><circle cx="63" cy="16" r="3" fill="#15803d" stroke="#15803d" /><rect x="52" y="24" width="22" height="16" fill="#f8f9fb" stroke="#9aa4b5" /><circle cx="63" cy="32" r="3" fill="#15803d" stroke="#15803d" /><rect x="52" y="40" width="22" height="16" fill="#f8f9fb" stroke="#9aa4b5" /><circle cx="63" cy="48" r="3" fill="#15803d" stroke="#15803d" /><rect x="52" y="56" width="22" height="16" fill="#f8f9fb" stroke="#9aa4b5" /><circle cx="63" cy="64" r="3" fill="#c2410c" stroke="#c2410c" /><rect x="74" y="8" width="22" height="16" fill="#f8f9fb" stroke="#9aa4b5" /><circle cx="85" cy="16" r="3" fill="#15803d" stroke="#15803d" /><rect x="74" y="24" width="22" height="16" fill="#f8f9fb" stroke="#9aa4b5" /><circle cx="85" cy="32" r="3" fill="#15803d" stroke="#15803d" /><rect x="74" y="40" width="22" height="16" fill="#f8f9fb" stroke="#9aa4b5" /><circle cx="85" cy="48" r="3" fill="#c2410c" stroke="#c2410c" /><rect x="74" y="56" width="22" height="16" fill="#f8f9fb" stroke="#9aa4b5" /><circle cx="85" cy="64" r="3" fill="#15803d" stroke="#15803d" /><rect x="96" y="8" width="22" height="16" fill="#f8f9fb" stroke="#9aa4b5" /><circle cx="107" cy="16" r="3" fill="#15803d" stroke="#15803d" /><rect x="96" y="24" width="22" height="16" fill="#f8f9fb" stroke="#9aa4b5" /><circle cx="107" cy="32" r="3" fill="#c2410c" stroke="#c2410c" /><rect x="96" y="40" width="22" height="16" fill="#f8f9fb" stroke="#9aa4b5" /><circle cx="107" cy="48" r="3" fill="#15803d" stroke="#15803d" /><rect x="96" y="56" width="22" height="16" fill="#f8f9fb" stroke="#9aa4b5" /><circle cx="107" cy="64" r="3" fill="#15803d" stroke="#15803d" /><rect x="6" y="8" width="22" height="16" fill="#d5dae2" stroke="none" /><rect x="6" y="24" width="22" height="16" fill="#d5dae2" stroke="none" /><rect x="6" y="40" width="22" height="16" fill="#d5dae2" stroke="none" /><rect x="6" y="56" width="22" height="16" fill="#d5dae2" stroke="none" /></svg><figcaption><b>部品と関心事の表</b>形：行に部品、列に認証、監視、リトライなどの関心事を取り、対応済みに印、抜けに別の印を置く<span>使う場面：どの部品で横断的な対応が抜けているか</span></figcaption></figure>
</div>
<h2>やりとり</h2><div class="g">
