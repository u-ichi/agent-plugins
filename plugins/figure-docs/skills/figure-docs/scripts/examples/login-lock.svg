<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<defs><marker id="fs-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" stroke="context-stroke" fill="context-stroke"/></marker></defs>
<g data-arrow="start"><path class="arr" d="M8,82L38,82" marker-end="url(#fs-ah)"/></g>
<g data-arrow="ok"><path class="arr" d="M240,72L398,72" marker-end="url(#fs-ah)"/><text class="ts" x="320" y="62" text-anchor="middle">正しく入力する</text></g>
<g data-arrow="logout"><path class="arr" d="M400,92L242,92" marker-end="url(#fs-ah)"/><text class="ts" x="320" y="112" text-anchor="middle">ログアウトする</text></g>
<g data-arrow="lock"><path class="arr" d="M100,104L100,258" marker-end="url(#fs-ah)"/><text class="ts" x="92" y="186" text-anchor="end">3回まちがえる</text></g>
<g data-arrow="unlock"><path class="arr" d="M180,260L180,106" marker-end="url(#fs-ah)"/><text class="ts" x="188" y="186">30分たつ</text></g>
<g data-arrow="forgot1"><path class="arr" d="M232,104L420,258" marker-end="url(#fs-ah)"/><text class="ts" x="340" y="166">「忘れた」を押す</text></g>
<g data-arrow="forgot2"><path class="arr" d="M240,282L398,282" marker-end="url(#fs-ah)"/><text class="ts" x="320" y="274" text-anchor="middle">「忘れた」を押す</text></g>
<g data-arrow="save"><path class="arr" d="M500,260L500,106" marker-end="url(#fs-ah)"/><text class="ts" x="508" y="186">保存する</text></g>
<g data-arrow="lockedin"><path class="arr" d="M140,304L140,334L622,334L622,82L602,82" marker-end="url(#fs-ah)"/><text class="ts" x="380" y="352" text-anchor="middle">正しく入力する</text></g>
<g data-box="waiting" class="c-gray"><rect x="40" y="60" width="200" height="44" rx="8"/><text class="th" x="140" y="87" text-anchor="middle">パスワードの入力待ち</text></g>
<g data-box="in" class="c-gray"><rect x="400" y="60" width="200" height="44" rx="8"/><text class="th" x="500" y="87" text-anchor="middle">ログイン済み</text></g>
<g data-box="locked" class="c-gray"><rect x="40" y="260" width="200" height="44" rx="8"/><text class="th" x="140" y="287" text-anchor="middle">ロック中</text></g>
<g data-box="reset" class="c-gray"><rect x="400" y="260" width="200" height="44" rx="8"/><text class="th" x="500" y="287" text-anchor="middle">新しいパスワードを決める</text></g>
</svg>
