<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>図の見本</title><style>body{font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;background:#f6f7f9;color:#1d2430;margin:0;padding:16px}h1{font-size:1.3rem}h2{font-size:1.05rem;margin:22px 0 8px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}figure{margin:0;background:#fff;border:1px solid #d5dae2;border-radius:8px;padding:8px}svg{width:100%;height:auto;display:block}figcaption{font-size:.8rem;line-height:1.5}figcaption b{display:block;font-size:.85rem}figcaption span{display:block;color:#5d6778}</style></head><body>
<!-- 資料の図の形の見本。各図の svg は形を示す最小の描き方で、値は架空。数のある図の分類と名前は Financial Times Visual Vocabulary（MIT）による。 -->
<h1>図の見本（93種）</h1>
<h2>差</h2><div class="g">
<figure><svg viewBox="0 0 120 80" role="img" aria-label="Diverging bar"><line x1="60" y1="4" x2="60" y2="76" stroke="#9aa4b5" stroke-width="1.5" /><rect x="60" y="8" width="40" height="10" fill="#dbe8fd" stroke="#2563eb" /><rect x="60" y="22" width="25" height="10" fill="#dbe8fd" stroke="#2563eb" /><rect x="40" y="36" width="20" height="10" fill="#fde5d6" stroke="#c2410c" /><rect x="25" y="50" width="35" height="10" fill="#fde5d6" stroke="#c2410c" /><rect x="60" y="64" width="10" height="10" fill="#dbe8fd" stroke="#2563eb" /></svg><figcaption><b>Diverging bar</b>形：0の線から右に正、左に負の棒を伸ばす<span>使う場面：正と負の両方の値を持つ量</span></figcaption></figure>
<figure><svg viewBox="0 0 120 80" role="img" aria-label="Diverging stacked bar"><line x1="60" y1="4" x2="60" y2="76" stroke="#9aa4b5" stroke-width="1.5" /><rect x="33" y="10" width="20" height="12" fill="#fde5d6" stroke="#c2410c" /><rect x="53" y="10" width="14" height="12" fill="#d5dae2" stroke="#9aa4b5" /><rect x="67" y="10" width="30" height="12" fill="#dbe8fd" stroke="#2563eb" /><rect x="25" y="30" width="30" height="12" fill="#fde5d6" stroke="#c2410c" /><rect x="55" y="30" width="10" height="12" fill="#d5dae2" stroke="#9aa4b5" /><rect x="65" y="30" width="15" height="12" fill="#dbe8fd" stroke="#2563eb" /><rect x="38" y="50" width="12" height="12" fill="#fde5d6" stroke="#c2410c" /><rect x="50" y="50" width="20" height="12" fill="#d5dae2" stroke="#9aa4b5" /><rect x="70" y="50" width="40" height="12" fill="#dbe8fd" stroke="#2563eb" /></svg><figcaption><b>Diverging stacked bar</b>形：中立を中央に置き、賛成を右、反対を左に積む<span>使う場面：賛成、中立、反対のような向きのある回答</span></figcaption></figure>
<figure><svg viewBox="0 0 120 80" role="img" aria-label="Spine chart"><line x1="60" y1="4" x2="60" y2="76" stroke="#9aa4b5" stroke-width="1.5" /><rect x="25" y="10" width="35" height="12" fill="#fde5d6" stroke="#c2410c" /><rect x="60" y="10" width="25" height="12" fill="#dbe8fd" stroke="#2563eb" /><rect x="40" y="30" width="20" height="12" fill="#fde5d6" stroke="#c2410c" /><rect x="60" y="30" width="40" height="12" fill="#dbe8fd" stroke="#2563eb" /><rect x="30" y="50" width="30" height="12" fill="#fde5d6" stroke="#c2410c" /><rect x="60" y="50" width="30" height="12" fill="#dbe8fd" stroke="#2563eb" /></svg><figcaption><b>Spine chart</b>形：1本の帯を中央の線で左右2つに分ける<span>使う場面：1つの値を対になる2つに分ける（男女など）</span></figcaption></figure>
<figure><svg viewBox="0 0 120 80" role="img" aria-label="Surplus/deficit filled line"><line x1="10" y1="40" x2="112" y2="40" stroke="#9aa4b5" stroke-width="1.5" /><polygon points="10,40 30,22 50,30 60,40" fill="#dbe8fd" stroke="#2563eb"/><polygon points="60,40 75,55 95,50 112,40" fill="#fde5d6" stroke="#c2410c"/></svg><figcaption><b>Surplus/deficit filled line</b>形：基準線より上を1色、下を別の色で塗った線<span>使う場面：基準や2系列の間の差の積み重なり</span></figcaption></figure>
</div>
<h2>相関</h2><div class="g">
<figure><svg viewBox="0 0 120 80" role="img" aria-label="Scatterplot"><line x1="10" y1="70" x2="112" y2="70" stroke="#9aa4b5" stroke-width="1" /><line x1="10" y1="6" x2="10" y2="70" stroke="#9aa4b5" stroke-width="1" /><circle cx="15" cy="61" r="2" fill="#2563eb" stroke="#2563eb" /><circle cx="21" cy="63" r="2" fill="#2563eb" stroke="#2563eb" /><circle cx="27" cy="57" r="2" fill="#2563eb" stroke="#2563eb" /><circle cx="33" cy="58" r="2" fill="#2563eb" stroke="#2563eb" /><circle cx="39" cy="56" r="2" fill="#2563eb" stroke="#2563eb" /><circle cx="45" cy="44" r="2" fill="#2563eb" stroke="#2563eb" /><circle cx="51" cy="40" r="2" fill="#2563eb" stroke="#2563eb" /><circle cx="57" cy="51" r="2" fill="#2563eb" stroke="#2563eb" /><circle cx="63" cy="39" r="2" fill="#2563eb" stroke="#2563eb" /><circle cx="69" cy="36" r="2" fill="#2563eb" stroke="#2563eb" /><circle cx="75" cy="45" r="2" fill="#2563eb" stroke="#2563eb" /><circle cx="81" cy="34" r="2" fill="#2563eb" stroke="#2563eb" /><circle cx="87" cy="37" r="2" fill="#2563eb" stroke="#2563eb" /><circle cx="93" cy="28" r="2" fill="#2563eb" stroke="#2563eb" /><circle cx="99" cy="28" r="2" fill="#2563eb" stroke="#2563eb" /></svg><figcaption><b>Scatterplot</b>形：横軸と縦軸に2つの値を取り、1件を1点で置く<span>使う場面：2つの連続した値の関係</span></figcaption></figure>
<figure><svg viewBox="0 0 120 80" role="img" aria-label="Line + Column"><line x1="10" y1="70" x2="112" y2="70" stroke="#9aa4b5" stroke-width="1" /><line x1="10" y1="6" x2="10" y2="70" stroke="#9aa4b5" stroke-width="1" /><rect x="14" y="50" width="14" height="20" fill="#dbe8fd" stroke="#2563eb" /><rect x="34" y="40" width="14" height="30" fill="#dbe8fd" stroke="#2563eb" /><rect x="54" y="45" width="14" height="25" fill="#dbe8fd" stroke="#2563eb" /><rect x="74" y="30" width="14" height="40" fill="#dbe8fd" stroke="#2563eb" /><rect x="94" y="35" width="14" height="35" fill="#dbe8fd" stroke="#2563eb" /><polyline points="21,50 41,35 61,40 81,20 101,15" fill="none" stroke="#c2410c" stroke-width="1.5" /></svg><figcaption><b>Line + Column</b>形：量を棒、率を線で同じ横軸に重ねる<span>使う場面：量と率の関係</span></figcaption></figure>
<figure><svg viewBox="0 0 120 80" role="img" aria-label="Connected scatterplot"><line x1="10" y1="70" x2="112" y2="70" stroke="#9aa4b5" stroke-width="1" /><line x1="10" y1="6" x2="10" y2="70" stroke="#9aa4b5" stroke-width="1" /><polyline points="20,60 35,50 45,55 65,35 80,40 100,15" fill="none" stroke="#2563eb" stroke-width="1.5" /><circle cx="20" cy="60" r="2" fill="#2563eb" stroke="#2563eb" /><circle cx="35" cy="50" r="2" fill="#2563eb" stroke="#2563eb" /><circle cx="45" cy="55" r="2" fill="#2563eb" stroke="#2563eb" /><circle cx="65" cy="35" r="2" fill="#2563eb" stroke="#2563eb" /><circle cx="80" cy="40" r="2" fill="#2563eb" stroke="#2563eb" /><circle cx="100" cy="15" r="2" fill="#2563eb" stroke="#2563eb" /></svg><figcaption><b>Connected scatterplot</b>形：散布図の点を時間の順に線で結ぶ<span>使う場面：2つの値の関係が時間でどう動いたか</span></figcaption></figure>
<figure><svg viewBox="0 0 120 80" role="img" aria-label="Bubble"><line x1="10" y1="70" x2="112" y2="70" stroke="#9aa4b5" stroke-width="1" /><line x1="10" y1="6" x2="10" y2="70" stroke="#9aa4b5" stroke-width="1" /><circle cx="30" cy="55" r="6" fill="#dbe8fd" stroke="#2563eb" /><circle cx="55" cy="40" r="12" fill="#dbe8fd" stroke="#2563eb" /><circle cx="85" cy="25" r="9" fill="#dcf3e3" stroke="#15803d" /><circle cx="100" cy="55" r="4" fill="#fde5d6" stroke="#c2410c" /></svg><figcaption><b>Bubble</b>形：散布図の点を、3つ目の値に比例した面積の円にする<span>使う場面：2つの値の関係に大きさを足す</span></figcaption></figure>
<figure><svg viewBox="0 0 120 80" role="img" aria-label="XY heatmap"><rect x="12" y="6" width="20" height="16" fill="#eef3fd" stroke="#fff" /><rect x="12" y="22" width="20" height="16" fill="#c6d8fb" stroke="#fff" /><rect x="12" y="38" width="20" height="16" fill="#8db4f7" stroke="#fff" /><rect x="12" y="54" width="20" height="16" fill="#2563eb" stroke="#fff" /><rect x="32" y="6" width="20" height="16" fill="#c6d8fb" stroke="#fff" /><rect x="32" y="22" width="20" height="16" fill="#2563eb" stroke="#fff" /><rect x="32" y="38" width="20" height="16" fill="#c6d8fb" stroke="#fff" /><rect x="32" y="54" width="20" height="16" fill="#2563eb" stroke="#fff" /><rect x="52" y="6" width="20" height="16" fill="#8db4f7" stroke="#fff" /><rect x="52" y="22" width="20" height="16" fill="#c6d8fb" stroke="#fff" /><rect x="52" y="38" width="20" height="16" fill="#eef3fd" stroke="#fff" /><rect x="52" y="54" width="20" height="16" fill="#2563eb" stroke="#fff" /><rect x="72" y="6" width="20" height="16" fill="#2563eb" stroke="#fff" /><rect x="72" y="22" width="20" height="16" fill="#2563eb" stroke="#fff" /><rect x="72" y="38" width="20" height="16" fill="#2563eb" stroke="#fff" /><rect x="72" y="54" width="20" height="16" fill="#2563eb" stroke="#fff" /><rect x="92" y="6" width="20" height="16" fill="#eef3fd" stroke="#fff" /><rect x="92" y="22" width="20" height="16" fill="#c6d8fb" stroke="#fff" /><rect x="92" y="38" width="20" height="16" fill="#8db4f7" stroke="#fff" /><rect x="92" y="54" width="20" height="16" fill="#2563eb" stroke="#fff" /></svg><figcaption><b>XY heatmap</b>形：行と列に2つの分類を取り、マスを値の濃さで塗る<span>使う場面：2つの分類の間の傾向</span></figcaption></figure>
</div>
<h2>順位</h2><div class="g">
<figure><svg viewBox="0 0 120 80" role="img" aria-label="Ordered bar"><rect x="10" y="8" width="95" height="10" fill="#dbe8fd" stroke="#2563eb" /><rect x="10" y="23" width="75" height="10" fill="#dbe8fd" stroke="#2563eb" /><rect x="10" y="38" width="60" height="10" fill="#dbe8fd" stroke="#2563eb" /><rect x="10" y="53" width="40" height="10" fill="#dbe8fd" stroke="#2563eb" /><rect x="10" y="68" width="20" height="10" fill="#dbe8fd" stroke="#2563eb" /></svg><figcaption><b>Ordered bar</b>形：値の大きい順に横棒を並べる<span>使う場面：順位をいちばん読みやすく見せる</span></figcaption></figure>
<figure><svg viewBox="0 0 120 80" role="img" aria-label="Ordered column"><rect x="14" y="10" width="14" height="60" fill="#dbe8fd" stroke="#2563eb" /><rect x="34" y="22" width="14" height="48" fill="#dbe8fd" stroke="#2563eb" /><rect x="54" y="34" width="14" height="36" fill="#dbe8fd" stroke="#2563eb" /><rect x="74" y="46" width="14" height="24" fill="#dbe8fd" stroke="#2563eb" /><rect x="94" y="58" width="14" height="12" fill="#dbe8fd" stroke="#2563eb" /></svg><figcaption><b>Ordered column</b>形：値の大きい順に縦棒を並べる<span>使う場面：順位（横に並べたいとき）</span></figcaption></figure>
<figure><svg viewBox="0 0 120 80" role="img" aria-label="Ordered proportional symbol"><circle cx="22" cy="40" r="16" fill="#dbe8fd" stroke="#2563eb" /><circle cx="55" cy="40" r="11" fill="#dbe8fd" stroke="#2563eb" /><circle cx="80" cy="40" r="7" fill="#dbe8fd" stroke="#2563eb" /><circle cx="100" cy="40" r="4" fill="#dbe8fd" stroke="#2563eb" /></svg><figcaption><b>Ordered proportional symbol</b>形：値に比例した円を大きい順に並べる<span>使う場面：値の差が大きく、細かい差は要らない順位</span></figcaption></figure>
<figure><svg viewBox="0 0 120 80" role="img" aria-label="Dot strip plot"><line x1="10" y1="15" x2="112" y2="15" stroke="#d5dae2" stroke-width="1.5" /><circle cx="29" cy="15" r="3" fill="#c2410c" stroke="#c2410c" /><circle cx="75" cy="15" r="3" fill="#dbe8fd" stroke="#2563eb" /><circle cx="97" cy="15" r="3" fill="#dbe8fd" stroke="#2563eb" /><circle cx="65" cy="15" r="3" fill="#dbe8fd" stroke="#2563eb" /><circle cx="85" cy="15" r="3" fill="#dbe8fd" stroke="#2563eb" /><line x1="10" y1="35" x2="112" y2="35" stroke="#d5dae2" stroke-width="1.5" /><circle cx="79" cy="35" r="3" fill="#c2410c" stroke="#c2410c" /><circle cx="21" cy="35" r="3" fill="#dbe8fd" stroke="#2563eb" /><circle cx="87" cy="35" r="3" fill="#dbe8fd" stroke="#2563eb" /><circle cx="71" cy="35" r="3" fill="#dbe8fd" stroke="#2563eb" /><circle cx="44" cy="35" r="3" fill="#dbe8fd" stroke="#2563eb" /><line x1="10" y1="55" x2="112" y2="55" stroke="#d5dae2" stroke-width="1.5" /><circle cx="18" cy="55" r="3" fill="#c2410c" stroke="#c2410c" /><circle cx="97" cy="55" r="3" fill="#dbe8fd" stroke="#2563eb" /><circle cx="60" cy="55" r="3" fill="#dbe8fd" stroke="#2563eb" /><circle cx="83" cy="55" r="3" fill="#dbe8fd" stroke="#2563eb" /><circle cx="98" cy="55" r="3" fill="#dbe8fd" stroke="#2563eb" /></svg><figcaption><b>Dot strip plot</b>形：分類ごとの横線の上に、各項目を点で置く<span>使う場面：複数の分類の順位を狭い場所に並べる</span></figcaption></figure>
<figure><svg viewBox="0 0 120 80" role="img" aria-label="Slope"><line x1="25" y1="6" x2="25" y2="74" stroke="#9aa4b5" stroke-width="1.5" /><line x1="95" y1="6" x2="95" y2="74" stroke="#9aa4b5" stroke-width="1.5" /><line x1="25" y1="15" x2="95" y2="55" stroke="#c2410c" stroke-width="1.5" /><line x1="25" y1="40" x2="95" y2="20" stroke="#2563eb" stroke-width="1.5" /><line x1="25" y1="62" x2="95" y2="40" stroke="#2563eb" stroke-width="1.5" /></svg><figcaption><b>Slope</b>形：左右2本の縦線に2時点の値を置き、同じ項目を線で結ぶ<span>使う場面：順位が時間や分類でどう入れ替わったか</span></figcaption></figure>
<figure><svg viewBox="0 0 120 80" role="img" aria-label="Lollipop chart"><line x1="10" y1="12" x2="105" y2="12" stroke="#2563eb" stroke-width="1.5" /><circle cx="105" cy="12" r="4" fill="#2563eb" stroke="#2563eb" /><line x1="10" y1="26" x2="85" y2="26" stroke="#2563eb" stroke-width="1.5" /><circle cx="85" cy="26" r="4" fill="#2563eb" stroke="#2563eb" /><line x1="10" y1="40" x2="65" y2="40" stroke="#2563eb" stroke-width="1.5" /><circle cx="65" cy="40" r="4" fill="#2563eb" stroke="#2563eb" /><line x1="10" y1="54" x2="50" y2="54" stroke="#2563eb" stroke-width="1.5" /><circle cx="50" cy="54" r="4" fill="#2563eb" stroke="#2563eb" /><line x1="10" y1="68" x2="35" y2="68" stroke="#2563eb" stroke-width="1.5" /><circle cx="35" cy="68" r="4" fill="#2563eb" stroke="#2563eb" /></svg><figcaption><b>Lollipop chart</b>形：細い線の先に点を付けた棒を大きい順に並べる<span>使う場面：棒より値に目を向けさせる</span></figcaption></figure>
</div>
<h2>分布</h2><div class="g">
<figure><svg viewBox="0 0 120 80" role="img" aria-label="Histogram"><line x1="10" y1="70" x2="112" y2="70" stroke="#9aa4b5" stroke-width="1" /><line x1="10" y1="6" x2="10" y2="70" stroke="#9aa4b5" stroke-width="1" /><rect x="14" y="62" width="11" height="8" fill="#dbe8fd" stroke="#2563eb" /><rect x="26" y="50" width="11" height="20" fill="#dbe8fd" stroke="#2563eb" /><rect x="38" y="32" width="11" height="38" fill="#dbe8fd" stroke="#2563eb" /><rect x="50" y="15" width="11" height="55" fill="#dbe8fd" stroke="#2563eb" /><rect x="62" y="28" width="11" height="42" fill="#dbe8fd" stroke="#2563eb" /><rect x="74" y="45" width="11" height="25" fill="#dbe8fd" stroke="#2563eb" /><rect x="86" y="58" width="11" height="12" fill="#dbe8fd" stroke="#2563eb" /><rect x="98" y="65" width="11" height="5" fill="#dbe8fd" stroke="#2563eb" /></svg><figcaption><b>Histogram</b>形：値の区間ごとの件数を、間の狭い縦棒で並べる<span>使う場面：分布の形</span></figcaption></figure>
<figure><svg viewBox="0 0 120 80" role="img" aria-label="Boxplot"><line x1="25" y1="8" x2="25" y2="70" stroke="#2563eb" stroke-width="1.5" /><rect x="15" y="25" width="20" height="25" fill="#dbe8fd" stroke="#2563eb" /><line x1="15" y1="38" x2="35" y2="38" stroke="#c2410c" stroke-width="2" /><line x1="60" y1="15" x2="60" y2="65" stroke="#2563eb" stroke-width="1.5" /><rect x="50" y="30" width="20" height="18" fill="#dbe8fd" stroke="#2563eb" /><line x1="50" y1="40" x2="70" y2="40" stroke="#c2410c" stroke-width="2" /><line x1="95" y1="5" x2="95" y2="60" stroke="#2563eb" stroke-width="1.5" /><rect x="85" y="18" width="20" height="22" fill="#dbe8fd" stroke="#2563eb" /><line x1="85" y1="28" x2="105" y2="28" stroke="#c2410c" stroke-width="2" /></svg><figcaption><b>Boxplot</b>形：中央値の線、四分位の四角、最小と最大のひげを分類ごとに並べる<span>使う場面：複数の分布を中央値と範囲でまとめる</span></figcaption></figure>
<figure><svg viewBox="0 0 120 80" role="img" aria-label="Violin plot"><path d="M25,6 C40,25 30,45 38,55 S30,70 25,74 C20,70 12,60 12,55 S10,25 25,6Z" fill="#dbe8fd" stroke="#2563eb"/><path d="M60,6 C75,25 65,45 73,55 S65,70 60,74 C55,70 47,60 47,55 S45,25 60,6Z" fill="#dbe8fd" stroke="#2563eb"/><path d="M95,6 C110,25 100,45 108,55 S100,70 95,74 C90,70 82,60 82,55 S80,25 95,6Z" fill="#dbe8fd" stroke="#2563eb"/></svg><figcaption><b>Violin plot</b>形：分布の形を左右対称の膨らみで描く<span>使う場面：平均でまとめられない複雑な分布</span></figcaption></figure>
<figure><svg viewBox="0 0 120 80" role="img" aria-label="Population pyramid"><line x1="60" y1="4" x2="60" y2="76" stroke="#9aa4b5" stroke-width="1.5" /><rect x="48" y="6" width="12" height="8" fill="#fde5d6" stroke="#c2410c" /><rect x="60" y="6" width="9" height="8" fill="#dbe8fd" stroke="#2563eb" /><rect x="40" y="16" width="20" height="8" fill="#fde5d6" stroke="#c2410c" /><rect x="60" y="16" width="17" height="8" fill="#dbe8fd" stroke="#2563eb" /><rect x="30" y="26" width="30" height="8" fill="#fde5d6" stroke="#c2410c" /><rect x="60" y="26" width="27" height="8" fill="#dbe8fd" stroke="#2563eb" /><rect x="22" y="36" width="38" height="8" fill="#fde5d6" stroke="#c2410c" /><rect x="60" y="36" width="35" height="8" fill="#dbe8fd" stroke="#2563eb" /><rect x="18" y="46" width="42" height="8" fill="#fde5d6" stroke="#c2410c" /><rect x="60" y="46" width="39" height="8" fill="#dbe8fd" stroke="#2563eb" /><rect x="20" y="56" width="40" height="8" fill="#fde5d6" stroke="#c2410c" /><rect x="60" y="56" width="37" height="8" fill="#dbe8fd" stroke="#2563eb" /><rect x="25" y="66" width="35" height="8" fill="#fde5d6" stroke="#c2410c" /><rect x="60" y="66" width="32" height="8" fill="#dbe8fd" stroke="#2563eb" /></svg><figcaption><b>Population pyramid</b>形：年齢を縦に取り、男女を左右に背中合わせの横棒で描く<span>使う場面：年齢と性別の分布</span></figcaption></figure>
